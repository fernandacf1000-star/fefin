<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EDF1F1">
<title>Atualizar Norte</title>
<body style="background:#EDF1F1;color:#1D2B33;font:18px system-ui;padding:32px">
<p role="status">Atualizando seu Norte…</p>
<script>
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.filter(r => new URL(r.scope).origin === location.origin).map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(k => k.startsWith('norte-shell-')).map(k => caches.delete(k)));
    }
    location.replace('/?norte-version=7&atualizado=' + Date.now());
  } catch {
    document.querySelector('[role="status"]').textContent = 'Não foi possível atualizar. Confira sua conexão e abra esta página novamente.';
  }
})();
</script>
</body>
</html>
